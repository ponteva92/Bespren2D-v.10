[mcp_servers.godot]
enabled = true
command = 'C:\Program Files\nodejs\npx.cmd'
args = ["-y", "@coding-solo/godot-mcp"]
startup_timeout_sec = 120

[mcp_servers.godot.env]
GODOT_PATH = 'C:\Users\heikk\Desktop\Godot_v4.7.1-stable_win64.exe'

[mcp_servers.godot.tools.get_project_info]
approval_mode = "approve"

[mcp_servers.godot.tools.get_godot_version]
approval_mode = "approve"

[mcp_servers.godot.tools.get_debug_output]
approval_mode = "approve"

[mcp_servers.godot.tools.run_project]
approval_mode = "approve"

[mcp_servers.godot.tools.stop_project]
approval_mode = "approve"

[mcp_servers.blender]
enabled = true
command = 'C:\Users\heikk\.local\bin\blendmcp.exe'
args = []
startup_timeout_sec = 120
